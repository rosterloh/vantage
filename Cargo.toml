[workspace]
resolver = "3"
members = [
    "vantage-protocol",
    "vantage-signalling",
    "vantage-observability",
    "vantage-coordinator",
    "vantage-robot",
    "vantage-client",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.90"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
mdns-sd = "0.20.3"

# OpenTelemetry (logs, metrics, traces) exported over OTLP/gRPC. Versions must
# move together — tracing-opentelemetry 0.34 pins the opentelemetry 0.33 line.
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["metrics", "logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-semantic-conventions = "0.33.1"
tracing-opentelemetry = "0.34.0"
