[workspace]
resolver = "3"
members = [
    "vantage-protocol",
    "vantage-signalling",
    "vantage-observability",
    "vantage-coordinator",
    "vantage-robot",
    "vantage-client",
]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
anyhow = "1.0.104"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-util", "io-std"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
mdns-sd = "0.22.0"

# OpenTelemetry (logs, metrics, traces) exported over OTLP/gRPC. Versions must
# move together — tracing-opentelemetry 0.34 pins the opentelemetry 0.33 line.
opentelemetry = "0.33.1"
opentelemetry_sdk = { version = "0.33.1", features = ["metrics", "logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "trace", "metrics", "logs"] }
opentelemetry-appender-tracing = "0.33.1"
opentelemetry-semantic-conventions = "0.33.1"
tracing-opentelemetry = "0.34.0"

# vantage-robot's `ros` feature. rosterloh's ros2-rust integration branches,
# the same revs as eit_robot's rebot_b601_driver: upstream plus ros2_rust #719,
# without which a failed take ends `spin` and a callback error leaves the wait
# set unregistered under rmw_zenoh. Pinned by rev because each rebuild rewrites
# the branch. Drop both once a crates.io rclrs contains #719.
[patch.crates-io]
rclrs = { git = "https://github.com/rosterloh/ros2_rust", rev = "95a18ec7b92cc9f46dee634b65200c99853fe2f3" }
rosidl_runtime_rs = { git = "https://github.com/rosterloh/rosidl_runtime_rs", rev = "2311b51c7e5efb882790adb3c1c8f9349a7a1118" }
