[package]
name = "vantage-robot"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
vantage-protocol = { path = "../vantage-protocol" }
vantage-signalling = { path = "../vantage-signalling" }
vantage-observability = { path = "../vantage-observability" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
sysinfo = "0.39.6"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
mdns-sd.workspace = true
tokio-tungstenite = "0.30.0"
futures-util = "0.3.34"

# ROS 2 bridge (off by default). rclrs ships its bindings; ros-env compiles the
# message crates from the sourced ROS 2 env (AMENT_PREFIX_PATH, ROS_DISTRO), so
# `--features ros` needs a sourced Lyrical env but no libclang. rclrs and
# rosidl_runtime_rs are patched in the workspace Cargo.toml.
rclrs = { version = "0.8", optional = true }
ros-env = { version = "0.3", optional = true }
rosidl_runtime_rs = { version = "0.7", optional = true }

[features]
ros = ["dep:rclrs", "dep:ros-env", "dep:rosidl_runtime_rs"]
